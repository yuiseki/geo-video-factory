name: packages tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/renderer/package-lock.json
      - name: Install Python test dependencies
        run: python3 -m pip install -r packages/pipeline/requirements-dev.txt
      - name: Install Playwright browser and ffmpeg for renderer E2E
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm --prefix packages/renderer ci
          npx --prefix packages/renderer playwright install --with-deps chromium-headless-shell
      - name: Test packages
        env:
          FLYOVER_GL: swiftshader
        run: packages/test.sh

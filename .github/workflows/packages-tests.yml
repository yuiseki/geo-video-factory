name: packages tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/renderer/package-lock.json
      # The runner's default python3 moved to 3.14, for which the pinned numpy has no wheel: pip built it from
      # source and six numeric tests failed (bincount indices, arctan). Fix the interpreter, and refuse source builds
      # so that a missing wheel stops the install instead of changing the arithmetic.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/pipeline/requirements-dev.txt
      - name: Install ffmpeg (the compose tests run real filter graphs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python test dependencies
        run: "python3 -m pip install --only-binary=:all: -r packages/pipeline/requirements-dev.txt"
      - name: Test packages
        run: packages/test.sh

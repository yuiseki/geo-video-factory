name: packages tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/renderer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/renderer/package-lock.json
      - name: Install Node dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Typecheck and test renderer
        run: npm run typecheck && npm run test:coverage

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's default python3 moved to 3.14, for which the pinned numpy has no wheel: pip built it from
      # source and six numeric tests failed (bincount indices, arctan). Fix the interpreter, and refuse source builds
      # so that a missing wheel stops the install instead of changing the arithmetic.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/pipeline/requirements-dev.txt
      - name: Ensure ffmpeg is installed
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg already installed: $(ffmpeg -version | head -n 1)"
          else
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Install Python test dependencies
        run: python3 -m pip install --only-binary=:all: -r packages/pipeline/requirements-dev.txt
      - name: Test pipeline and skills
        run: |
          python3 -m coverage erase
          python3 -m coverage run --rcfile=packages/pipeline/.coveragerc \
            -m unittest discover -s packages/pipeline/tests -v
          python3 -m coverage report --rcfile=packages/pipeline/.coveragerc
          python3 packages/validate_skills.py
